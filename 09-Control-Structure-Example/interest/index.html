<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest calculate</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <form id="form">

        <label for="Amount">Enter principle Amount <i class="fa-solid fa-indian-rupee-sign"></i>: </label>
        <input type="number" placeholder="Enter principle Amount ₹" id="Amount" required>

<br>
        <label for="Time">Enter Time in Month  <i class="fa-solid fa-clock"></i>: </label>
        <input type="number" placeholder="Enter Total Month"  id="time"  required>
        
<br>
        <label for="Rate">Enter Rate of Amount <i class="fa-solid fa-percent"></i>: </label>
        <input type="number" placeholder="Intrest Rate %" id="rate" required>
<br>
        <button type="submit" id="submit">Check</button>
<br>
        <p id="result"></p>

    </form>



    <script src="index.js"></script>
</body>

</html>
