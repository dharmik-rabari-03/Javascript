<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Array Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>



    <div class="container">
        <div class="card">
            <h1 style="font-family: 'Times New Roman', Times, serif;text-align: center;">Array Method</h1>
            <br>
            <p id="arrayDefualt" style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">Array Value = []</p>

            <br>

            <label for="input" class="form-label" style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">➡️ Enter array value</label>
            <input type="text" class="form-control" id="array" placeholder="example : 10,20,30">


            <hr>

            <label for="input" class="form-label" style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">➡️ Enter Element</label>
            <input type="text" class="form-control" id="input" placeholder="example : 10">
            <hr>
            <label for="select" style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">Select Method ⬇️</label>
            <hr>
            <select name="" id="select" class="form-select bg-dark text-white">
                <option value="">Select </option>
                <option value="push">push</option>
                <option value="unshift">unshift</option>
                <option value="pop">pop</option>
                <option value="shift">shift</option>
                <option value="length">length</option>
                <option value="toString">toString</option>
                <option value="reverse">reverse</option>
                <option value="indexOf">indexOf</option>
                <option value="includes">includes</option>
                <option value="sort">sort</option>
                <option value="ascending">ascending</option>
                <option value="descending">descending</option>
                <option value="find">find</option>
                <option value="findIndex">findIndex</option>
                <option value="some">some</option>
                <option value="every">every</option>
                <option value="filter">filter</option>
                <option value="map">map</option>
                <option value="reduce">reduce</option>
            </select>

            <br>

            <button type="submit" id="btn" class="btn btn-outline-success">check</button>
            <br>

            <p id="result"class="text-center"></p>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
