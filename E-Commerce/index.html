
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg  container rounded-3 mt-2">
        <div class="container ">
            <a class="navbar-brand text-white" href="#">ShopEasy</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon text-white"></span>
            </button>
            <div class="collapse navbar-collapse " id="navbarSupportedContent">
                <ul class="navbar-nav m-auto mb-2 mb-lg-0 ">
                    <li class="nav-item">
                        <a class="nav-link active text-white" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">

                        <button type="button" class="btn btn-primary" onclick="openCart()">cart</button>
                    </li>
                    <li class="nav-item">

                        <button type="button" class="btn btn-primary ms-2" data-bs-toggle="modal"
                            data-bs-target="#exampleModal2">
                            Add Product
                        </button>
                    </li>


                </ul>
                <form class="d-flex text-white" role="search">
                    <input class="form-control me-2 text-white" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success text-white" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <main>
        <div class="container-fluid mt-5 ">
            <div class="p-list" id="product-list">
            </div>
        </div>


        <center>
            <section>


                <!-- modal -->

                <div class="modal fade " id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content p-4 ">
                             
                            <div class="modal-header">
                                <h3 class="text-center m-3">Product Cart</h3>
                               <button type="button" class="btn-close bg-white" data-bs-dismiss="modal"
                                    aria-label="Close"></button>

                            
                            </div>

                            <table class="table text-center ">
                                <thead>
                                    <tr>
                                        <th>product image</th>
                                        <th>Product</th>
                                        <th>Quentity</th>
                                        <th>Price</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="t-body" class="table-group-divider">



                                </tbody>
                            </table>
                            <div class="modal-footer">
                                <h2 class="me-auto" id="total">₹</h2>
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button class="btn btn-primary" id="checkbtn" onclick="checkout()">Checkout</button>
                            </div>

                        </div>
                    </div>
                </div>

            </section>
        </center>

        <center>
            <section>


                <div class="modal fade" id="exampleModal2" tabindex="-1" aria-labelledby="exampleModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="exampleModalLabel">Add Product</h1>
                               <button type="button" class="btn-close bg-white" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">

                                <form id="form">

                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="name" placeholder="Name">
                                        <label class="text-white" for="floatingInput">Product Name</label>

                                    </div>

                                    <div class="form-floating">
                                        <input type="number" class="form-control" id="price" placeholder="price">
                                        <label class="text-white" for="floatingPassword">Price</label>
                                    </div>

                                    <div class="form-floating mt-3">
                                        <input type="text" class="form-control" id="img" placeholder="img">
                                        <label class="text-white" for="floatingInput">image URL</label>

                                    </div>

                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="button" class="btn btn-primary" onclick="addNewProduct()">
                                    Add Product
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </section>
        </center>

        <!-- update modal -->


        <center>
            <section>

                <div class="modal fade" id="exampleModal3" tabindex="-1" aria-labelledby="exampleModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="exampleModalLabel">Edit Product</h1>
                                <button type="button" class="btn-close bg-white" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">


                                <form id="form2">
                                    <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="newName"
                                        placeholder="name">
                                    <label for="floatingInput" class="text-white">Product Name</label>
                                </div>
                                <div class="form-floating">
                                    <input type="number" class="form-control" id="newPrice"
                                        placeholder="price">
                                    <label for="floatingPassword" class="text-white">Price</label>
                                </div>
                                 <div class="form-floating mt-3">
                                    <input type="text" class="form-control" id="newImg"
                                        placeholder="img">
                                    <label for="floatingInput" class="text-white">image URL</label>
                                </div>

                                 <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary" >Save changes</button>
                            </div>
                                </form>

                                

                            </div>
                           
                        </div>
                    </div>
                </div>

            </section>
        </center>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="script.js"></script>
</body>

</html>
