<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
<form class="form" id="form">
    <span class="head">Currency Converter</span>

    <input type="number" placeholder="Enter Money" class="form--input" id="money" required>
    
    <input type="text" placeholder="Type : DollartoINR or INRtoDollar" class="form--input" id="type" required>
    
 
    <button class="form--submit">
        Convert
    </button>

    <p id="result"></p>

</form>
    </div>


    <script src="script.js"></script>

</body>
</html>
