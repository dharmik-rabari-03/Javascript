<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowel | Consonant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>



    <div class="container">


        <form id="form">
            <h1>Vowel And Consonant Check</h1>
            <br><br><br>
            <label for="Alphabet">Enter one Alphabet :</label>
            <input type="text" name="Alphabet" id="Alphabet" placeholder="Enter one Alphabet" required>


            <br>
            <button type="submit" class="btn">
                <strong>Check</strong>
                <div id="container-stars">
                    <div id="stars"></div>
                </div>

                <div id="glow">
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>

            </button>




            <br>

            <b id="result"></b>
        </form>

    </div>


    <script src="index.js"></script>
</body>

</html>
