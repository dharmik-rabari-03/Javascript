<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Digits of a Number</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">


        <form class="form" id="form">
            <p class="heading">Sum Of Digit</p>
            <br>
            <label for="number">Enter Digits</label>
            <input placeholder="Enter Digits" class="input" id="number" type="number">
            <button class="btn" type="submit">Sum</button>


            <br>

            <p id="result"></p>

        </form>

    </div>




    <script src="script.js"></script>
</body>

</html>
