<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Js Practicle (E-commerce)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div class="container-fluid d-flex justify-content-center">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">easyProduct</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav m-auto p-2 d-flex gap-3">
                        <li class="nav-item">
                            <button class="btn btn-outline-success" onclick="cart()">Cart</button>
                        </li>
                        <li class="nav-item">
                            <button class="btn btn-outline-success " aria-current="page" href="#"
                                onclick="AddProduct()">Add
                                Product</button>
                        </li>
                        <li>
                            <select name="" id="select" class="btn btn-outline-success">
                                <option value="">Sort By Price</option>
                                <option value="low">Price : Low To High</option>
                                <option value="High">Price : High To Low</option>
                            </select>
                        </li>


                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" id="searchInput" />
                        
                    </form>
                </div>
            </div>
        </nav>
    </div>

    <div class="container">


        <div id="product">
        </div>

        <div class="modal" tabindex="-1" id="modal1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <form action="" id="form">
                        <div class="modal-body">

                            <label for="name">Enter New Name : </label>
                            <input type="text" id="NewName">
                            <hr>

                            <label for="name">Enter New price : </label>
                            <input type="text" id="NewPrice">
                            <hr>
                            <label for="name">Enter Img SRC : </label>
                            <input type="text" id="Newimg">
                            <hr>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Save changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>


        <br>



        <div class="modal" tabindex="-1" id="modal2">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add New Product</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form action="" id="form2">
                        <div class="modal-body" id="modal2-body">
                            <label for="name">Enter Name : </label>
                            <input type="text" id="newNames">
                            <hr>

                            <label for="name">Enter price : </label>
                            <input type="text" id="price">
                            <hr>
                            <label for="name">Enter Image src : </label>
                            <input type="text" id="imgSrc">
                            <hr>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Save changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>




        <br>




        <div class="modal" tabindex="-1" id="modal3">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Product</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body" id="modal2-body">


                        <table class="table">
                            <thead>
                                <tr>
                                    <th scope="col">No.</th>
                                    <th scope="col">Img</th>
                                    <th scope="col">Product</th>
                                    <th scope="col">Price</th>
                                    <th scope="col">Delete</th>
                                </tr>
                            </thead>
                            <tbody id="tbody2">


                            </tbody>
                        </table>

                    </div>
                    <div class="modal-footer d-flex justify-content-between">
                        <div>
                            <p id="totalPrice"></p>
                        </div>

                        <div>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary" onclick="PlaceOrder()">Save changes</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
