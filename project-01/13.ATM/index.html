<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Withdrawal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <form id="form">

            <h2 style="text-align: center;">ATM Withdrawal Simulator</h2>

            <label for="number">Enter balance</label>
            <input type="number" id="balance" placeholder="Enter balance" required>

            <label for="number">Enter Withdrawal Amount</label>
            <input type="number" id="Withdrawal" placeholder="Enter Withdrawal Amount" required>

            <br>
            <button type="submit">Withdraw</button>

            <br>
            <p id="result"></p>

        </form>
    </div>



    <script src="script.js"></script>
</body>

</html>
