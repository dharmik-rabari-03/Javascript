<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest Number Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form id="form">

        <h1 style="font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;color:cyan;">Largest Number Finder 🔍</h1>

        <label for="Number">Enter First Number </label>
        <input type="number" placeholder="Enter First Number" id="FirstNumber" required>
        <br>

        <label for="Number">Enter Second Number</label>
        <input type="number" placeholder="Enter Second Number" id="SecondNumber" required>

        <br>

        <label for="Number">Enter Third Number</label>
        <input type="number" placeholder="Enter Third Number" id="ThirdNumber" required>
        <br>
        <button type="submit">Check</button>

        <br>

        <p id="result"></p>

    </form>


    <script src="index.js"></script>
</body>

</html>
