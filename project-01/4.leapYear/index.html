<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Leap Year Checker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="d-flex justify-content-center align-items-center vh-100">
            <div class="card " style="width: 30rem;height: 25rem;">
                <div class="card-body text-center">

                    <h5 class="card-title mb-3 fs-2">Leap Year Checker</h5>

                    <form id="form">
                        <div class="mb-3">

                            <label class="form-label fs-4">Enter Year</label>
                            <br>
                            <input type="number" class="w-75 fs-5  m-3 text-black " placeholder="Enter Year" id="year" required>

                        </div>

                        <button type="submit" class="btn btn-grad  w-50">
                            Check
                        </button>

                        <p id="result" class="mt-5 fw-bold fs-3"></p>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
